    #data-error-toast {
      position: fixed;

      border-radius: 50%;

<body>

<div class="section header-row">
    <div>
        <div style="font-size: 30px;">Week: <span id="week">---</span></div>
        <div style="font-size: 30px;">Date: <span id="date">---</span></div>

    <h1>DAILY SCHEDULE</h1>
    <h1></h1>
    <div>
        Weather: <span id="weather">---</span>
        <img id="weather-icon" src="" alt="">
        <button class="green-btn" onclick="refreshPage()">Refresh</button>
        <button onclick="openSettingsDialog()">Setting</button>

</div>

<dialog id="settings-dialog">
    <h2 style="margin-top: 0;">Cài đặt giờ sáng màn hình</h2>
    <div style="text-align: left; margin-bottom: 10px;">

	  <table id="schedule-table">
	    <thead>
	      <tr>
        <th>Name</th>
        <th>Status</th>
        <th>Location</th>
        <th>Name</th>
        <th>Status</th>
        <th>Location</th>
      </tr>
    </thead>
	    <tbody id="table-body">
	      <!-- Data will be populated here -->
	    </tbody>
	  </table>

	  <section class="weather-forecast-section" aria-labelledby="forecast-title">
	    <!-- <h2 id="forecast-title" class="weather-forecast-title">Ha Noi's Weather</h2> -->
	    <table id="weather-forecast-table" class="weather-forecast-table">
	      <thead id="forecast-head">
	        <tr>
	          <th></th>
	        </tr>
	      </thead>
	      <tbody id="forecast-body">
	        <!-- Forecast data will be populated here -->
	      </tbody>
	    </table>
	  </section>
	
	  <script>
	    const API_URL = 'https://script.google.com/macros/s/AKfycbyfQUpog4dd7pHx_2GlLFcrb4mT6gBLRPlFKnjkGcClr9UzT-SdCSwyREENhoo3iOeXMA/exec';
	    const DISPLAY_ROW_COUNT = 6;
	    const FORECAST_DAYS = 7;
	    const HANOI_LAT = 21.0285;
	    const HANOI_LON = 105.8542;
	    let rowData = [];
    const statuses = ['Available', 'Busy', 'Offline'];

    const DATA_RETRY_DELAY_MS = 30000;   // lỗi tạm thời (Apps Script cold start...) -> thử lại sau 30s
    const DATA_RETRY_MAX_ATTEMPTS = 5;   // không retry vô hạn, chờ tới chu kỳ 30 phút kế tiếp
    let dataRetryTimer = null;
    let dataRetryCount = 0;
    let lastDataErrorMessage = "";

    function showDataErrorToast(message) {
      lastDataErrorMessage = message;
      document.getElementById("data-error-toast").style.display = "flex";
    }

    function hideDataErrorToast() {
      document.getElementById("data-error-toast").style.display = "none";
      document.getElementById("data-error-detail").style.display = "none";
    }

    function toggleDataErrorDetail() {
      const detail = document.getElementById("data-error-detail");
      detail.textContent = lastDataErrorMessage;
      detail.style.display = detail.style.display === "block" ? "none" : "block";
    }

    function scheduleDataRetry() {
      if (dataRetryTimer || dataRetryCount >= DATA_RETRY_MAX_ATTEMPTS) return;
      dataRetryCount++;
      dataRetryTimer = setTimeout(() => {
        dataRetryTimer = null;
        fetchDataFromSheet();
      }, DATA_RETRY_DELAY_MS);
    }

    async function fetchDataFromSheet() {
      try {
        const res = await fetch(API_URL);
        if (!res.ok) throw new Error('Failed to fetch data');
        const data = await res.json();

        dataRetryCount = 0;
        hideDataErrorToast();
  
        rowData = data.slice(0, DISPLAY_ROW_COUNT).map(item => ({
          name1: item.name1 || '',
          status1: item.status1 || '',
          location1: item.location1 || '',
          name2: item.name2 || '',
          status2: item.status2 || '',
          location2: item.location2 || ''
        }));
  
        while (rowData.length < DISPLAY_ROW_COUNT) {
          rowData.push({
            name1: '',
            status1: 'Offline',
            location1: '',
            name2: '',
            status2: 'Offline',
            location2: ''
          });
        }
  
        fillTable();
      } catch (error) {
        console.error("❌ Lỗi fetch từ Sheet:", error);
        showDataErrorToast("Không tải được dữ liệu mới nhất: " + error.message);
        scheduleDataRetry();
      }
    }
  
    function createRow(data) {
      return `
      <tr>
        <td>${data.name1}</td>
        <td>${data.status1}</td>
        <td>${data.location1}</td>
        <td>${data.name2}</td>
        <td>${data.status2}</td>
        <td>${data.location2}</td>
      </tr>`;
    }
  
	    function fillTable() {
	      const tbody = document.getElementById("table-body");
	      tbody.innerHTML = "";
	      rowData.forEach(data => {
	        tbody.innerHTML += createRow(data);
	      });
	    }

	    function getForecastLabel(dateString, index) {
	      if (index === 0) return "Today";
	      if (index === 1) return "Tomorrow";

	      return new Date(dateString).toLocaleDateString("en-US", {
	        weekday: "short"
	      });
	    }

	    function getWeatherVisual(code) {
	      if (code === 0) return { icon: "&#9728;", label: "Sunny" };
	      if ([1, 2].includes(code)) return { icon: "&#9925;", label: "Partly cloudy" };
	      if (code === 3) return { icon: "&#9729;", label: "Cloudy" };
	      if ([45, 48].includes(code)) return { icon: "&#127787;", label: "Fog" };
	      if ([51, 53, 55, 56, 57].includes(code)) return { icon: "&#127783;", label: "Drizzle" };
	      if ([61, 63, 65, 66, 67, 80, 81, 82].includes(code)) return { icon: "&#127783;", label: "Rain" };
	      if ([71, 73, 75, 77, 85, 86].includes(code)) return { icon: "&#10052;", label: "Snow" };
	      if ([95, 96, 99].includes(code)) return { icon: "&#9928;", label: "Storm" };
	      return { icon: "&#9925;", label: "Forecast" };
	    }

	    function createForecastDayCells(forecast) {
	      return forecast.map((day, index) =>
	        `<th class="forecast-day">${getForecastLabel(day.time, index)}</th>`
	      ).join("");
	    }

	    function createForecastRow(label, className, values) {
	      return `
	      <tr>
	        <td class="weather-label-cell">${label}</td>
	        ${values.map(value => `<td class="${className}">${value}</td>`).join("")}
	      </tr>`;
	    }

	    function renderForecastTable(forecast) {
	      const head = document.getElementById("forecast-head");
	      const body = document.getElementById("forecast-body");

	      head.innerHTML = `
	        <tr>
	          <th></th>
	          ${createForecastDayCells(forecast)}
	        </tr>`;

	      const weatherCells = forecast.map(day => {
	        const visual = getWeatherVisual(day.weatherCode);
	        return `
	          <span class="forecast-icon">${visual.icon}</span>
	          <span class="forecast-summary">${visual.label}</span>`;
	      });

	      const maxCells = forecast.map(day => `${day.maxTemp.toFixed(1)}&deg;C`);
	      const minCells = forecast.map(day => `${day.minTemp.toFixed(1)}&deg;C`);

	      body.innerHTML =
	        createForecastRow("Weather", "", weatherCells) +
	        createForecastRow("Max", "temp-max", maxCells) +
	        createForecastRow("Min", "temp-min", minCells);
	    }

	    function renderForecastFallback() {
	      const forecast = Array.from({ length: FORECAST_DAYS }, (_, index) => ({
	        time: new Date(Date.now() + index * 86400000).toISOString().split("T")[0]
	      }));
	      const head = document.getElementById("forecast-head");
	      const body = document.getElementById("forecast-body");

	      head.innerHTML = `
	        <tr>
	          <th></th>
	          ${createForecastDayCells(forecast)}
	        </tr>`;

	      body.innerHTML =
	        createForecastRow("Weather", "", Array.from({ length: FORECAST_DAYS }, () => "---")) +
	        createForecastRow("Max", "temp-max", Array.from({ length: FORECAST_DAYS }, () => "---")) +
	        createForecastRow("Min", "temp-min", Array.from({ length: FORECAST_DAYS }, () => "---"));
	    }

	    async function updateForecast() {
	      const url =
	        "https://api.open-meteo.com/v1/forecast" +
	        "?latitude=" + HANOI_LAT +
	        "&longitude=" + HANOI_LON +
	        "&current=weather_code" +
	        "&daily=weather_code,temperature_2m_max,temperature_2m_min" +
	        "&forecast_days=" + FORECAST_DAYS +
	        "&timezone=Asia/Ho_Chi_Minh";

	      try {
	        const res = await fetch(url);
	        if (!res.ok) throw new Error("Forecast API error");

	        const data = await res.json();
	        const forecast = data.daily.time.map((time, index) => ({
	          time,
	          // Ngày hôm nay (index 0) dùng mã thời tiết hiện tại để khớp thực tế thay vì mã tổng hợp cả ngày
	          weatherCode: index === 0 && data.current
	            ? data.current.weather_code
	            : data.daily.weather_code[index],
	          maxTemp: data.daily.temperature_2m_max[index],
	          minTemp: data.daily.temperature_2m_min[index]
	        }));

	        renderForecastTable(forecast);
	      } catch (error) {
	        console.error("Forecast error:", error);
	        renderForecastFallback();
	      }
	    }
	  
  
function updateDate() {
  try {
    const now = new Date();

    if (isNaN(now.getTime())) {
      throw new Error("Invalid local date");
    }

    document.getElementById("date").textContent =
      now.toLocaleDateString('vi-VN');

    document.getElementById("week").textContent =
      "Week " + getWeekNumber(now);

  } catch (error) {
    console.error("Date error:", error);
    document.getElementById("date").textContent = "---";
    document.getElementById("week").textContent = "---";
  }
}

    
    function getWeekNumber(date) {
      const start = new Date(date.getFullYear(), 0, 1);
      const diff = date - start + ((start.getTimezoneOffset() - date.getTimezoneOffset()) * 60000);
      const oneWeek = 604800000;
      return Math.floor(diff / oneWeek) + 1;
    }
  

  
	    async function updateWeather() {
	  const lat = HANOI_LAT;   // Hanoi
	  const lon = HANOI_LON;  // Hanoi

  const url =
    "https://api.open-meteo.com/v1/forecast" +
    "?latitude=" + lat +
    "&longitude=" + lon +
    "&hourly=temperature_2m,relativehumidity_2m" +
    "&timezone=Asia/Ho_Chi_Minh";

  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error("Weather API error");

    const data = await res.json();

    const now = new Date();

    // Làm tròn về đầu giờ
    now.setMinutes(0, 0, 0);

    const isoHour =
      now.getFullYear() + "-" +
      String(now.getMonth() + 1).padStart(2, "0") + "-" +
      String(now.getDate()).padStart(2, "0") + "T" +
      String(now.getHours()).padStart(2, "0") + ":00";

    const idx = data.hourly.time.indexOf(isoHour);

    if (idx === -1) throw new Error("Hour not found");

    const temperature = data.hourly.temperature_2m[idx];
    const humidity = data.hourly.relativehumidity_2m[idx];

    document.getElementById("weather").textContent =
      temperature + "°C | " + humidity + "% RH";

    document.getElementById("weather-icon").src =
      "https://cdn-icons-png.flaticon.com/512/1163/1163624.png";

  } catch (err) {
    console.error("Weather error:", err);
    document.getElementById("weather").textContent = "---";
  }
}

    function refreshPage() {
      window.location.reload();
    }

    const BLACKOUT_REVEAL_MS = 5000;         // chạm vào thì sáng tạm 5 giây
    const BLACKOUT_SETTINGS_KEY = "scheduleBlackoutSettings";
    const DEFAULT_LIGHT_START_MIN = 8 * 60 + 30;  // 08:30
    const DEFAULT_LIGHT_END_MIN = 17 * 60 + 30;   // 17:30

    let lightStartMin = DEFAULT_LIGHT_START_MIN;
    let lightEndMin = DEFAULT_LIGHT_END_MIN;
    let blackoutRevealTimer = null;

    function minutesToTimeInput(min) {
      const h = Math.floor(min / 60).toString().padStart(2, "0");
      const m = (min % 60).toString().padStart(2, "0");
      return h + ":" + m;
    }

    function timeInputToMinutes(value) {
      const parts = value.split(":");
      return Number(parts[0]) * 60 + Number(parts[1]);
    }

    function loadBlackoutSettings() {
      try {
        const raw = localStorage.getItem(BLACKOUT_SETTINGS_KEY);
        if (!raw) return;
        const saved = JSON.parse(raw);
        if (Number.isInteger(saved.lightStartMin)) lightStartMin = saved.lightStartMin;
        if (Number.isInteger(saved.lightEndMin)) lightEndMin = saved.lightEndMin;
      } catch (err) {
        console.error("Không đọc được cài đặt giờ sáng/tối:", err);
      }
    }

    function openSettingsDialog() {
      document.getElementById("light-start-input").value = minutesToTimeInput(lightStartMin);
      document.getElementById("light-end-input").value = minutesToTimeInput(lightEndMin);
      document.getElementById("settings-dialog").showModal();
    }

    function closeSettingsDialog() {
      document.getElementById("settings-dialog").close();
    }

    function saveBlackoutSettings() {
      const startValue = document.getElementById("light-start-input").value;
      const endValue = document.getElementById("light-end-input").value;
      if (!startValue || !endValue) return;

      lightStartMin = timeInputToMinutes(startValue);
      lightEndMin = timeInputToMinutes(endValue);
      localStorage.setItem(BLACKOUT_SETTINGS_KEY, JSON.stringify({ lightStartMin, lightEndMin }));

      updateBlackoutState();
      closeSettingsDialog();
    }

    function isBlackoutTime() {
      const now = new Date();
      const minutes = now.getHours() * 60 + now.getMinutes();
      if (lightStartMin === lightEndMin) return false; // cấu hình rỗng -> coi như luôn sáng

      if (lightStartMin < lightEndMin) {
        // Khoảng sáng nằm trong một ngày (vd 08:30 -> 17:30)
        return !(minutes >= lightStartMin && minutes < lightEndMin);
      }
      // Khoảng sáng qua nửa đêm (vd 20:00 -> 06:00)
      return !(minutes >= lightStartMin || minutes < lightEndMin);
    }

    function updateBlackoutState() {
      const overlay = document.getElementById("screen-blackout");
      if (isBlackoutTime()) {
        if (!blackoutRevealTimer) {
          overlay.style.display = "block";
        }
      } else {
        overlay.style.display = "none";
        if (blackoutRevealTimer) {
          clearTimeout(blackoutRevealTimer);
          blackoutRevealTimer = null;
        }
      }
    }

    function revealScreenTemporarily() {
      const overlay = document.getElementById("screen-blackout");
      overlay.style.display = "none";
      if (blackoutRevealTimer) {
        clearTimeout(blackoutRevealTimer);
      }
      blackoutRevealTimer = setTimeout(() => {
        blackoutRevealTimer = null;
        updateBlackoutState();
      }, BLACKOUT_REVEAL_MS);
    }

    document.getElementById("screen-blackout").addEventListener("click", revealScreenTemporarily);
    document.getElementById("screen-blackout").addEventListener("touchstart", revealScreenTemporarily);

    // Nút test thủ công: ép đen/sáng ngay để kiểm tra, không chờ đúng khung giờ.
    // Lịch tự động (setInterval mỗi phút) vẫn chạy nên sau tối đa 1 phút sẽ quay lại đúng theo giờ thật.
    function testBlackout(forceDark) {
      const overlay = document.getElementById("screen-blackout");
      if (blackoutRevealTimer) {
        clearTimeout(blackoutRevealTimer);
        blackoutRevealTimer = null;
      }
      overlay.style.display = forceDark ? "block" : "none";
    }

    document.addEventListener("DOMContentLoaded", () => {
      updateDate();
      updateWeather();
      updateForecast();
      fetchDataFromSheet(); // lần đầu
      loadBlackoutSettings();
      updateBlackoutState();

      setInterval(() => {
      fetchDataFromSheet();   // cập nhật dữ liệu
      updateWeather();        // cập nhật thời tiết
      updateForecast();       // update forecast
      }, 1800000); // mỗi 30 phút (30 * 60 * 1000 ms)

      setInterval(updateBlackoutState, 60000); // kiểm tra giờ đen màn hình mỗi phút
    });
  </script>
